name: Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - oauth-mcp-integration

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # web-ui is an npm project (LastChat uses npm + package-lock.json, not pnpm).
      # The :app preBuild task invokes `npm run build` from web-ui/, so Node + npm
      # must be on PATH for the gradle build to succeed.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # The debug build type uses the auto-generated debug keystore and the project does not
      # apply the google-services plugin, so no signing secrets or google-services.json are
      # required here (unlike release.yml).
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk