name: Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - oauth-mcp-integration

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # web-ui is an npm project (LastChat uses npm + package-lock.json, not pnpm).
      # We build it in its own step so PATH is correct, then tell Gradle to skip
      # :app:buildWebUi and use the pre-built artifacts in web-ui/build/client.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Build web-ui bundle
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      # The google-services Gradle plugin requires app/google-services.json to exist,
      # but the file is gitignored (it lives in local.properties / secrets). For a debug
      # build that doesn't actually call Firebase APIs, an empty JSON object is sufficient.
      # If a real GOOGLE_SERVICES_JSON secret is configured on the repo, it overrides this stub.
      - name: Write stub google-services.json
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '{}' > app/google-services.json
            echo "Wrote stub google-services.json (no secret configured)."
          else
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
            echo "Wrote google-services.json from secret."
          fi

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # The debug build type uses the auto-generated debug keystore and the project does not
      # apply the google-services plugin, so no signing secrets or google-services.json are
      # required here (unlike release.yml).
      # -x :app:buildWebUi skips the in-Gradle npm build because web-ui/ was already built
      # in the previous step.
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -x :app:buildWebUi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk